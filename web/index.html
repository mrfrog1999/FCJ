<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 首帧同步给白底：透明状态栏（black-translucent）下页面铺满整块物理屏，
         必须首帧就有背景色 WebKit 才会按透明处理；同时避免冷启动闪灰底。 -->
    <style>html, body { background-color: #ffffff; }</style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- iOS 全屏 Web App：隐藏浏览器工具栏，状态栏透明（black-translucent），
         页面铺满整块物理屏（含状态栏与安全区），白色头部与状态栏无缝衔接。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="随手记" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>随手记 - 轻松记录每一笔</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
